services:
  app:
    image: billing-parent-app:latest
    ports:
      - "8081:8080"
    networks:
      - app-network
    deploy:
      replicas: 1

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: invoice_db
      POSTGRES_USER: invoice_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: overlay

volumes:
  postgres-data:
